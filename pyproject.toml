[project]
name = "x68pcm"
version = "2026.4.4"
description = "x68k ADPCM converter"
readme = "README.md"
authors = [
    { name = "yumimint", email = "i.yumimint@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
x68pcm = "x68pcm:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/yumimint/x68pcm"
Issues = "https://github.com/yumimint/x68pcm/issues"
